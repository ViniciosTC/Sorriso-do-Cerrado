version: '3.9'

services:
  mysql:
    image: mysql:8
    container_name: sorriso_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sorrisodb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./Back-End
    container_name: sorriso_backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: sorrisodb
      BETTER_AUTH_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ABACATEPAY_MODE: ${ABACATEPAY_MODE:-test}
      ABACATEPAY_API_KEY_DEV: ${ABACATEPAY_API_KEY_DEV:-}
      ABACATEPAY_API_KEY_PROD: ${ABACATEPAY_API_KEY_PROD:-}
      ABACATEPAY_COMMISSION_TEST: ${ABACATEPAY_COMMISSION_TEST:-10}
      ABACATEPAY_COMMISSION_PROD: ${ABACATEPAY_COMMISSION_PROD:-}
      ABACATEPAY_API_KEY: ${ABACATEPAY_API_KEY:-}
      ABACATEPAY_WEBHOOK_SECRET: ${ABACATEPAY_WEBHOOK_SECRET:-}
      ARTESAO_DADOS_ENCRYPTION_KEY: ${ARTESAO_DADOS_ENCRYPTION_KEY:-}
    volumes:
      - ./Back-End:/app
      - backend_node_modules:/app/node_modules
      - ./Back-End/uploads:/app/uploads

  frontend:
    build:
      context: ./Front-End
    container_name: sorriso_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./Front-End:/app
      - /app/node_modules

volumes:
  mysql_data:
  backend_node_modules: